name: Compilar IPA para TrollStore / Certificado

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto Xcode nativo e íconos
        run: |
          mkdir -p WaSchedulerApp/WaSchedulerApp/Assets.xcassets/AppIcon.appiconset
          cp SourceCode/WaSchedulerApp.swift WaSchedulerApp/WaSchedulerApp/
          cp Payload/WaScheduler.app/index.html WaSchedulerApp/WaSchedulerApp/
          
          # Copiar íconos al catálogo de activos nativo de Xcode
          cp Payload/WaScheduler.app/AppIcon60x60@2x.png WaSchedulerApp/WaSchedulerApp/Assets.xcassets/AppIcon.appiconset/
          cp Payload/WaScheduler.app/AppIcon60x60@3x.png WaSchedulerApp/WaSchedulerApp/Assets.xcassets/AppIcon.appiconset/
          cp Payload/WaScheduler.app/AppIcon1024x1024.png WaSchedulerApp/WaSchedulerApp/Assets.xcassets/AppIcon.appiconset/

          cat << 'EOF' > WaSchedulerApp/WaSchedulerApp/Assets.xcassets/Contents.json
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          cat << 'EOF' > WaSchedulerApp/WaSchedulerApp/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon60x60@2x.png",
                "idiom" : "iphone",
                "scale" : "2x",
                "size" : "60x60"
              },
              {
                "filename" : "AppIcon60x60@3x.png",
                "idiom" : "iphone",
                "scale" : "3x",
                "size" : "60x60"
              },
              {
                "filename" : "AppIcon1024x1024.png",
                "idiom" : "ios-marketing",
                "scale" : "1x",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF
          
          cat << 'EOF' > WaSchedulerApp/project.yml
          name: WaScheduler
          options:
            bundleIdPrefix: com.hugoangarita
          targets:
            WaScheduler:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: WaSchedulerApp
              info:
                path: WaSchedulerApp/Info.plist
                properties:
                  CFBundleDisplayName: "WaScheduler"
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  LSRequiresIPhoneOS: true
                  UILaunchScreen:
                    UIColorName: ""
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  LSApplicationQueriesSchemes:
                    - whatsapp
                    - whatsapp-smb
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hugoangarita.wascheduler
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
          EOF

      - name: Instalar XcodeGen y generar proyecto
        run: |
          brew install xcodegen
          cd WaSchedulerApp && xcodegen generate

      - name: Compilar binario ARM64 nativo
        run: |
          cd WaSchedulerApp
          xcodebuild -project WaScheduler.xcodeproj \
            -scheme WaScheduler \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            BUILD_DIR="$PWD/build"

      - name: Empaquetar archivo .ipa listo para TrollStore / ESign / Sideloadly
        run: |
          mkdir -p Payload
          cp -r WaSchedulerApp/build/Release-iphoneos/WaScheduler.app Payload/
          zip -qry WaScheduler_iOS_v1.0.ipa Payload

      - name: Subir IPA como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: WaScheduler-IPA-TrollStore
          path: WaScheduler_iOS_v1.0.ipa
