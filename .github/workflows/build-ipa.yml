name: Compilar IPA para TrollStore / Certificado

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto Xcode nativo
        run: |
          mkdir -p WaSchedulerApp/WaSchedulerApp
          cp SourceCode/WaSchedulerApp.swift WaSchedulerApp/WaSchedulerApp/
          cp Payload/WaScheduler.app/index.html WaSchedulerApp/WaSchedulerApp/
          cp Payload/WaScheduler.app/AppIcon60x60@2x.png WaSchedulerApp/WaSchedulerApp/
          cp Payload/WaScheduler.app/AppIcon60x60@3x.png WaSchedulerApp/WaSchedulerApp/
          cp Payload/WaScheduler.app/AppIcon1024x1024.png WaSchedulerApp/WaSchedulerApp/
          
          cat << 'EOF' > WaSchedulerApp/project.yml
          name: WaScheduler
          options:
            bundleIdPrefix: com.hugoangarita
          targets:
            WaScheduler:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: WaSchedulerApp
                  excludes:
                    - "**/*.png"
              resources:
                - path: WaSchedulerApp/index.html
                - path: WaSchedulerApp/AppIcon60x60@2x.png
                - path: WaSchedulerApp/AppIcon60x60@3x.png
                - path: WaSchedulerApp/AppIcon1024x1024.png
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hugoangarita.wascheduler
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  INFOPLIST_KEY_CFBundleDisplayName: "WaScheduler"
                  INFOPLIST_KEY_LSApplicationQueriesSchemes: "whatsapp whatsapp-smb"
                  INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
          EOF

      - name: Instalar XcodeGen y generar proyecto
        run: |
          brew install xcodegen
          cd WaSchedulerApp && xcodegen generate

      - name: Compilar binario ARM64 nativo
        run: |
          cd WaSchedulerApp
          xcodebuild -project WaScheduler.xcodeproj \
            -scheme WaScheduler \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$PWD/build"

      - name: Empaquetar archivo .ipa listo para TrollStore / ESign / Sideloadly
        run: |
          mkdir -p Payload
          cp -r WaSchedulerApp/build/Release-iphoneos/WaScheduler.app Payload/
          zip -qry WaScheduler_iOS_v1.0.ipa Payload

      - name: Subir IPA como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: WaScheduler-IPA-TrollStore
          path: WaScheduler_iOS_v1.0.ipa
